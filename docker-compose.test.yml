# Local test only (mirrors the Railway template's variables). Not used by Railway.
services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: railway, POSTGRES_USER: postgres, POSTGRES_PASSWORD: testpass}
    labels: {her: "2289"}
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "redispass"]
    labels: {her: "2289"}
  opnform:
    build: ./opnform
    labels: {her: "2289"}
    environment:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      JWT_SECRET: localtestjwtsecretlocaltestjwtsecretlocaltest
      FRONT_API_SECRET: localfrontsecret
      APP_URL: http://localhost:${TEST_PORT}
      FRONT_URL: http://localhost:${TEST_PORT}
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: railway
      DB_USERNAME: postgres
      DB_PASSWORD: testpass
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: redispass
      CLIENT_UPSTREAM: http://client:3000
    volumes: [storage:/usr/share/nginx/html/storage]
    ports: ["${TEST_PORT}:8080"]
    depends_on: [db, redis]
  client:
    build: ./client
    labels: {her: "2289"}
    environment:
      NUXT_API_SECRET: localfrontsecret
      NUXT_PUBLIC_APP_URL: http://localhost:${TEST_PORT}
      NUXT_PUBLIC_API_BASE: http://localhost:${TEST_PORT}/api
      NUXT_PRIVATE_API_BASE: http://opnform:8080/api
volumes:
  storage:
